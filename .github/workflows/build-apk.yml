name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '**.ZIP'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip *.ZIP 2>/dev/null | head -n1)
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJ=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - name: Set worker URL
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cat > "$PROJECT_DIR/app/src/main/assets/app_config.json" <<'JSON'
          {
            "baked_worker_url": "https://dark-math-9990.hamid1384uio.workers.dev",
            "is_client_locked": true,
            "app_name": "hamid_taneel"
          }
          JSON

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.PROJECT_DIR }}/xray-core/go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build Xray-core AAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash build_xray.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hamid_taneel-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
