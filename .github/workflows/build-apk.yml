name: Build APK

on:
  push:
    paths:
      - 'hamid_taneel_fixed.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      worker_url:
        description: 'Cloudflare Worker URL to bake into the APK'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q hamid_taneel_fixed.zip -d project

      - name: Bake worker URL
        if: github.event.inputs.worker_url != ''
        working-directory: project
        env:
          WORKER_URL: ${{ github.event.inputs.worker_url }}
        run: |
          python3 -c "import json,os; p='app/src/main/assets/app_config.json'; d=json.load(open(p)); d['baked_worker_url']=os.environ['WORKER_URL'].rstrip('/'); d['is_client_locked']=True; json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)"
          cat app/src/main/assets/app_config.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        working-directory: project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hamid_taneel-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
