name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJ=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - name: Set worker URL
        run: |
          cat > "$PROJECT_DIR/app/src/main/assets/app_config.json" <<'JSON'
          {
            "baked_worker_url": "https://dark-math-9990.hamid1384uio.workers.dev",
            "is_client_locked": true,
            "app_name": "hamid_taneel"
          }
          JSON

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hamid_taneel-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
